name: Build synthetic viewer demo

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - ".node-version"
      - "graph/viewer-css/**"
      - "graph/viewer-src/**"
      - "graph/viewer.bundle.js"
      - "graph/viewer.css"
      - "graph/viewer_template.html"
      - "package-lock.json"
      - "package.json"
      - "scripts/build-pages-demo.mjs"
      - "scripts/bundle-viewer-css.mjs"
      - "scripts/release-screenshot-fixture.mjs"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - ".node-version"
      - "graph/viewer-css/**"
      - "graph/viewer-src/**"
      - "graph/viewer.bundle.js"
      - "graph/viewer.css"
      - "graph/viewer_template.html"
      - "package-lock.json"
      - "package.json"
      - "scripts/build-pages-demo.mjs"
      - "scripts/bundle-viewer-css.mjs"
      - "scripts/release-screenshot-fixture.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static demo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Set up npm
        run: npm install --global npm@11.17.0 --ignore-scripts

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Build maintained viewer and demo
        run: |
          npm run typecheck
          npm run bundle
          npm run demo:build

      - name: Verify generated bundle is current
        run: git diff --exit-code -- graph/viewer.css graph/viewer.bundle.js
